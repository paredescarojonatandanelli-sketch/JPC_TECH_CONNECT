<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro exitoso | JPC TECH Center</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .contenedor {
            max-width: 600px;
            min-height: 100vh;
            margin: auto;
            background: white;
            text-align: center;
            padding: 40px 25px;
        }

        .logo {
            width: 150px;
        }

        h1 {
            color: #07152f;
            margin-top: 30px;
        }

        .mensaje {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
        }

        .beneficio {
            margin-top: 25px;
            padding: 20px;
            background: #f1f6fc;
            border-radius: 10px;
        }

        a {
            display: block;
            margin-top: 25px;
            padding: 15px;
            background: #1261d6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <img
        src="{{ url_for('static', filename='img/logo.png') }}"
        alt="JPC TECH Center"
        class="logo"
    >

    <h1>
        ¡Registro exitoso!
    </h1>

    <p class="mensaje">
        Gracias, {{ nombre }}.
    </p>

    <div class="beneficio">

        🎉 Ya formas parte de
        <strong>JPC TECH Connect</strong>.

        <br><br>

        Pronto podrás acceder a nuestros
        beneficios, promociones y orientación
        tecnológica.

    </div>

    <a href="{{ url_for('inicio') }}">
        VOLVER A JPC TECH CENTER
    </a>

</div>

</body>

</html>
